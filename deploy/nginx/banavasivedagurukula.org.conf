# Nginx site for https://banavasivedagurukula.org
# Copy to /etc/nginx/sites-available/ and link into sites-enabled (see DEPLOYMENT.md).
# Certbot will add the HTTPS (443) block and redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name banavasivedagurukula.org www.banavasivedagurukula.org;

    root /var/www/banavasivedagurukula.org;
    index index.html;

    # React Router: send /about, /contact etc. to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS have hashed names — cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images — cache for a week
    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Always fetch the latest index.html after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
