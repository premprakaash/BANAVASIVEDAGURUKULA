name: Upload media to R2

# Copies everything in media/ to the Cloudflare R2 bucket.
# Runs when files in media/ change on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['media/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-r2
  cancel-in-progress: false

jobs:
  upload:
    name: Sync media/ to R2
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 does not need the newer default checksum headers sent by recent AWS CLI versions
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check R2 secrets
        run: |
          missing=""
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing R2 repository secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, R2_BUCKET). Missing:$missing. See MEDIA.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload videos (long cache)
        run: |
          aws s3 sync media/ "s3://$R2_BUCKET/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --exclude "*" --include "*.mp4" --include "*.webm" \
            --content-type video/mp4 \
            --cache-control "public, max-age=2592000" \
            --size-only --no-progress

      - name: Upload images (long cache)
        run: |
          aws s3 sync media/ "s3://$R2_BUCKET/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --exclude "*" --include "*.jpg" --include "*.jpeg" --include "*.png" --include "*.webp" \
            --cache-control "public, max-age=2592000" \
            --size-only --no-progress

      - name: List bucket
        run: |
          aws s3 ls "s3://$R2_BUCKET/gallery/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --human-readable
